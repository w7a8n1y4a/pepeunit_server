contract_version: v1

search:
  type: controller
  execution_type: interpreted
  name: resolved-controller
  platforms: [linux]
  description: Demonstrates reserved IO and defaults across nested schemas.

env:
  ENABLED: {type: bool, default: false}
  RETRIES: {type: int, min: 0, default: 0}
  MESSAGE: {type: string, nullable: true, default: null}
  PROFILE:
    type: object
    extra: true
    fields:
      name: {type: string, max_bytes: 32}
      labels:
        type: array
        max_items: 4
        items: {type: string, max_bytes: 16}
    default: {name: room, labels: []}

input:
  reset: {}
  env_update: {}
  relay:
    type: object
    qos: 1
    variants:
      set:
        enabled: {type: bool}
      pulse:
        duration: {type: int, min: 1, max: 60000, unit: ms}
    example: {action: pulse, duration: 500}

output:
  state: {}
  log: {}
  button: {type: string, codec: utf8, qos: 0}
  packet: {type: bytes, max_bytes: 220}
  samples:
    type: array
    qos: 1
    routing: broadcast
    items:
      type: object
      fields:
        value: {type: float, unit: Cel}
        note: {type: string, optional: true, nullable: true}
  command:
    type: object
    routing: selected-link
    fields:
      input_uuid: {type: string, format: uuid, max_bytes: 36}
      data: {type: any, max_bytes: 2048}
